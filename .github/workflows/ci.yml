name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Verify and build Paper plugin
        run: bash ./gradlew :meoweco-paper:check :meoweco-paper:shadowJar --no-daemon
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: meoweco-paper
          path: meoweco-paper/build/libs/meoweco-paper-*.jar
          if-no-files-found: error
